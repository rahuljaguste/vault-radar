<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- VaultRadar mark: the deck title slide's radar motif as a favicon. Dark ink
       chip, three green rings, one glowing blip off-centre. -->
  <rect width="64" height="64" rx="14" fill="#0b1220"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#22304a"/>
  <g fill="none" stroke="#34d399">
    <circle cx="32" cy="37" r="20" stroke-opacity="0.28"/>
    <circle cx="32" cy="37" r="13" stroke-opacity="0.5"/>
    <circle cx="32" cy="37" r="6" stroke-opacity="0.85"/>
  </g>
  <circle cx="43.5" cy="24.5" r="7" fill="#34d399" fill-opacity="0.22"/>
  <circle cx="43.5" cy="24.5" r="3.4" fill="#34d399"/>
</svg>
